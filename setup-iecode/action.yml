name: Set up iecode
description: Installs the iecode CLI (TwinCAT engineering from the command line) on a Windows runner and adds it to PATH. The runner needs TwinCAT XAE for build / activate.
branding:
  icon: cpu
  color: blue
inputs:
  version:
    description: Release to install, e.g. 0.4.0 (default latest)
    default: latest
outputs:
  path:
    description: Folder that contains iecode.exe
    value: ${{ steps.install.outputs.path }}
runs:
  using: composite
  steps:
    - id: install
      shell: pwsh
      env:
        # passed through the environment, not pasted into the script (no script injection)
        IECODE_VERSION: ${{ inputs.version }}
      run: |
        if ($env:RUNNER_OS -ne 'Windows') { throw 'setup-iecode needs a Windows runner (TwinCAT XAE is Windows only).' }
        $version = $env:IECODE_VERSION
        if ($version -notmatch '^(latest|v?\d+\.\d+\.\d+)$') { throw "Invalid version '$version' (expected latest or e.g. 0.4.0)." }
        $dir = Join-Path $env:RUNNER_TOOL_CACHE "iecode/$version"
        & "$env:GITHUB_ACTION_PATH/../packaging/install.ps1" -Version $version -InstallDir $dir
        Add-Content $env:GITHUB_PATH $dir
        "path=$dir" | Add-Content $env:GITHUB_OUTPUT
