name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Check the log viewer files are packaged
        run: |
          files=$(npx @vscode/vsce@4.0.0 ls --no-dependencies)
          for f in out/src/core/logsearchWorker.js media/logScroll.js media/logDisplay.js media/logViewer.js media/logViewer.css; do
            echo "$files" | grep -qFx "$f" || { echo "Missing from the package: $f"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vsix
          path: extension/*.vsix

  extension-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm test

  cli:
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: cli/global.json
      - run: dotnet build IECode.slnx -c Release
      - run: dotnet test --solution IECode.slnx -c Release --no-build
      - name: Smoke test (file-based commands)
        run: dotnet run --project src/IECode.Cli -c Release --no-build -- lib list tests/IECode.Core.Tests/Fixtures/Machine --json
      - name: Smoke test (lib check finds missing libraries)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/empty-repo"
          set +e
          out=$(dotnet run --project src/IECode.Cli -c Release --no-build -- lib check tests/IECode.Core.Tests/Fixtures/Machine --json --repository "$RUNNER_TEMP/empty-repo")
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 3
          test "$(echo "$out" | jq '.data.problems | length')" -eq 5

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Signed-off-by on every commit
        run: |
          missing=$(git log --format='%H %(trailers:key=Signed-off-by,valueonly,separator=;)' \
            ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | awk 'NF<2 {print $1}')
          if [ -n "$missing" ]; then echo "Commits without Signed-off-by (git commit -s):"; echo "$missing"; exit 1; fi
