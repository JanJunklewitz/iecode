name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - VS Code extension
        - iecode CLI
        - Installer (install.ps1 / tcpkg)
        - GitHub Action (setup-iecode)
        - Other platform support (CODESYS, Siemens, ...)
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Commands, settings or UI you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: What you tried, or how TwinCAT XAE / other tools handle it.
