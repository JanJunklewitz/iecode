# Weekly update PRs for the pinned actions and the npm / NuGet packages; security updates come as they're published.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /extension
    schedule: { interval: weekly }
  - package-ecosystem: nuget
    directory: /cli
    schedule: { interval: weekly }
